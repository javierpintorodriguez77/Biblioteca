# PostgreSQL local para desarrollo: docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: libreria
    ports:
      - "5432:5432"
    volumes:
      - datos_tienda:/var/lib/postgresql/data

volumes:
  datos_tienda:
